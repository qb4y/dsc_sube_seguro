document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"52b69846-2af8-4c5e-bc76-4680d560155d\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* SubeSeguro design system — global entry point.\n   Consumers link THIS one file. It is a list of @imports only. */\n\n/* SubeSeguro — Color tokens\n   Base palette is verbatim from the upstream subeseguro-ds library.\n   Dark, technical surface system + traffic-light verdict colors. */\n\n:root {\n  /* ---- Base surfaces (dark) ---- */\n  --color-background:       #0E1116; /* app canvas */\n  --color-surface:          #171C24; /* cards, rows */\n  --color-surface-elevated: #1F2630; /* secondary buttons, nested fills */\n  --color-line:             rgba(255, 255, 255, 0.08); /* hairline borders */\n\n  /* ---- Text ---- */\n  --color-text:             #EAEEF5; /* primary text */\n  --color-text-muted:       #8B95A7; /* labels, captions, meta */\n\n  /* ---- Brand ---- */\n  --color-brand:            #2FD6C6; /* teal — primary action, scan, accents */\n  --color-brand-ink:        #0E1116; /* text/icons on brand fills */\n\n  /* ---- Status — traffic-light verdict system ---- */\n  --color-success:          #34D27B; /* 🟢 Seguro */\n  --color-warning:          #F4B740; /* 🟡 Precaución */\n  --color-danger:           #FF5D5D; /* 🔴 Riesgo */\n\n  /* ---- Tinted status surfaces (color + ~13% alpha) ---- */\n  --color-success-surface:  rgba(52, 210, 123, 0.13);\n  --color-warning-surface:  rgba(244, 183, 64, 0.13);\n  --color-danger-surface:   rgba(255, 93, 93, 0.13);\n\n  /* ---- Tinted status borders (color + ~33% alpha) ---- */\n  --color-success-border:   rgba(52, 210, 123, 0.33);\n  --color-warning-border:   rgba(244, 183, 64, 0.33);\n  --color-danger-border:    rgba(255, 93, 93, 0.33);\n\n  /* ---- Plate (Peruvian license-plate physicality) ---- */\n  --color-plate-bg:         #F3F4F0; /* off-white plate face */\n  --color-plate-ink:        #15171C; /* plate characters */\n  --color-plate-blue:       #1B4FA0; /* \"PE\" euro-style flag strip */\n\n  /* ---- Semantic aliases (use these in product code) ---- */\n  --bg-app:        var(--color-background);\n  --surface-card:  var(--color-surface);\n  --surface-fill:  var(--color-surface-elevated);\n  --border-hair:   var(--color-line);\n  --text-body:     var(--color-text);\n  --text-meta:     var(--color-text-muted);\n  --accent:        var(--color-brand);\n}\n\n/* SubeSeguro — Typography tokens\n   The brand uses native system fonts intentionally: instant render, zero\n   webfont weight on low-end Android (the app's primary device), and a neutral\n   \"official document\" tone. Plate characters use a monospace face so every\n   glyph aligns like a real license plate. */\n\n:root {\n  /* ---- Font families ---- */\n  --font-sans:  ui-sans-serif, system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif;\n  --font-mono:  ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n\n  /* ---- Weights ---- */\n  --weight-regular:  400;\n  --weight-medium:   600;\n  --weight-bold:     700;\n  --weight-heavy:    800; /* the brand's signature heavy weight for numbers + actions */\n\n  /* ---- Type scale (px) ---- */\n  --text-display:  28px; /* hero verdict / screen titles */\n  --text-title:    22px; /* card verdict label */\n  --text-heading:  19px; /* vehicle name */\n  --text-lead:     18px; /* status \"big\" value */\n  --text-body-sz:  15px; /* default body / buttons */\n  --text-sub:      14px; /* secondary line */\n  --text-note:     13px; /* explanatory note */\n  --text-label:    12px; /* uppercase eyebrow labels */\n  --text-plate:    26px; /* license-plate characters */\n\n  /* ---- Tracking ---- */\n  --track-tight:   -0.02em; /* large bold values */\n  --track-label:   0.06em;  /* uppercase labels */\n  --track-plate:   0.14em;  /* spaced plate characters */\n}\n\n/* SubeSeguro — Spacing, radius, border & shadow tokens */\n\n:root {\n  /* ---- Spacing scale (px) ---- */\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  10px;\n  --space-4:  12px;\n  --space-5:  14px;\n  --space-6:  16px;  /* default card padding */\n  --space-7:  20px;\n  --space-8:  24px;\n  --space-10: 32px;\n\n  /* ---- Radius scale ---- */\n  --radius-sm:   10px; /* nested fills, choice chips */\n  --radius-md:   14px; /* buttons, inputs */\n  --radius-lg:   16px; /* status rows, vehicle card */\n  --radius-xl:   18px; /* verdict card */\n  --radius-pill: 999px;/* badges */\n\n  /* ---- Borders ---- */\n  --border-width:       1px;\n  --border-width-input: 2px; /* plate input + active choice */\n\n  /* ---- Shadows ---- */\n  /* The dark UI leans on tinted borders + surface contrast rather than heavy\n     drop shadows. One soft ambient shadow is used for floating/elevated layers. */\n  --shadow-none:  none;\n  --shadow-float: 0 12px 32px rgba(0, 0, 0, 0.45);\n  --shadow-glow:  0 0 0 4px rgba(47, 214, 198, 0.18); /* brand focus ring */\n}\n\n\n/* ---- Base reset for components rendered in preview iframes ---- */\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  background: var(--color-background);\n  color: var(--color-text);\n  font-family: var(--font-sans);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n<\u002Fstyle>\n<style>\n  * { box-sizing: border-box; }\n  html, body { margin: 0; }\n  body {\n    background: #07090d;\n    font-family: var(--font-sans);\n    color: var(--color-text);\n    -webkit-font-smoothing: antialiased;\n  }\n  .doc { display: flex; flex-direction: column; align-items: center; gap: 36px; padding: 44px 24px 80px; }\n  .sheet {\n    position: relative;\n    width: 1320px; height: 934px;\n    background: var(--color-background);\n    border: 1px solid var(--color-line);\n    border-radius: 14px;\n    overflow: hidden;\n    box-shadow: 0 24px 60px rgba(0,0,0,0.55);\n  }\n  .glow {\n    position: absolute; inset: 0; pointer-events: none;\n    background: radial-gradient(120% 70% at 50% -18%, rgba(47,214,198,0.10), rgba(47,214,198,0) 60%);\n  }\n  @page { size: 1320px 934px; margin: 0; }\n  @media print {\n    body { background: var(--color-background); }\n    .doc { gap: 0; padding: 0; }\n    .sheet { border: none; border-radius: 0; box-shadow: none; page-break-after: always; }\n    .sheet:last-child { page-break-after: auto; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"doc\">\n\n  <!-- ============ COVER ============ -->\n  <section class=\"sheet\" data-screen-label=\"Portada\">\n    <div class=\"glow\"><\u002Fdiv>\n    <div style=\"position:relative; height:100%; padding:56px 64px; display:flex; flex-direction:column;\">\n\n      <div style=\"display:flex; justify-content:space-between; align-items:flex-start;\">\n        <div style=\"font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-muted); font-weight:600;\">Hackathon DSC PUCP · Estado Peruano<\u002Fdiv>\n        <div style=\"font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-brand); font-weight:700;\">Sprint 0 · Hito 1 — Prototipo de arquitectura<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1; display:flex; flex-direction:column; justify-content:center; gap:26px;\">\n        <div style=\"display:flex; align-items:center; gap:18px;\">\n          <div style=\"width:62px; height:62px; border-radius:16px; background:var(--color-success-surface); border:1px solid var(--color-success-border); display:flex; align-items:center; justify-content:center; color:var(--color-brand);\">\n            <svg width=\"36\" height=\"36\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 -content:space-between; align-items:center; margin-bottom:12px;\">\n              <span style=\"font-size:16px; font-weight:800; color:var(--color-text);\">App móvil — React Native · Expo<\u002Fspan>\n              <span style=\"font-family:var(--font-mono); font-size:12px; color:var(--color-text-muted);\">Android / iOS<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:10px;\">\n              <div style=\"background:var(--color-surface-elevated); border:1px solid var(--color-line); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; color:var(--color-text);\">Pasajero<div style=\"font-size:12px; font-weight:400; color:var(--color-text-muted); margin-top:2px;\">verifica el taxi<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--color-surface-elevated); border:1px solid var(--color-line); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; color:var(--color-text);\">Comprador<div style=\"font-size:12px; font-weight:400; color:var(--color-text-muted); margin-top:2px;\">verifica antes de comprar<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:var(--color-surface-elevated); border:1px solid var(--color-line); border-radius:10px; padding:10px 12px; font-size:14px; font-weight:700; color:var(--color-text);\">Conductor<div style=\"font-size:12px; font-weight:400; color:var(--color-text-muted); margin-top:2px;\">QR verificado<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- connector -->\n        <div style=\"display:flex;\">\n          <div style=\"width:128px; flex-shrink:0;\"><\u002Fdiv>\n          <div style=\"flex:1; display:flex; justify-content:center; align-items:center; gap:14px; padding:10px 0;\">\n            <div style=\"width:2px; height:34px; background:linear-gradient(var(--color-brand),var(--color-line));\"><\u002Fdiv>\n            <span style=\"font-family:var(--font
